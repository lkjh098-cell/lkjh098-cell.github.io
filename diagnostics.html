<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>진단 — ZERO PROBLEMS</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"><link rel="stylesheet" href="shared.css">
<style>.wrap{max-width:760px;padding-top:30px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}td:first-child{color:var(--muted);width:40%}.ok{color:var(--ok);font-weight:700}.bad{color:#B0165A;font-weight:700}pre{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;overflow:auto;max-height:260px}</style></head>
<body><header class="top"><div class="wrap"><a href="index.html" style="display:flex;align-items:center"><img src="logo-black.png" alt="ZERO PROBLEMS 로고"><span class="sub">진단</span></a><a class="btn btn-ghost" href="index.html">처음으로</a></div></header>
<main class="wrap"><h1 style="font-size:22px">연동 상태 진단</h1><p style="color:var(--muted)">API 키·개인정보는 표시하지 않습니다. 이 페이지에서 목록 API를 1회 호출해 연결을 확인합니다.</p>
<table id="t"></table><p style="margin-top:14px"><button class="btn btn-main" id="ping">프록시 연결 확인 (목록 1페이지)</button> <button class="btn btn-ghost" id="demoOff">시연 모드 해제</button></p><pre id="out">아직 호출하지 않았습니다.</pre></main>
<script src="config.js"></script><script src="data.js"></script>
<script>
(function(){const $=id=>document.getElementById(id);
function row(k,v,cls){return `<tr><td>${k}</td><td class="${cls||""}">${v}</td></tr>`;}
function render(){const d=ZP.diag;const src=ZP.isDemo()?"mock (사용자가 명시적으로 켠 시연 모드)":ZP.config.DATA_SOURCE;
 $("t").innerHTML=row("현재 데이터 소스",src,ZP.isDemo()||ZP.config.DATA_SOURCE!=="visitseoul"?"bad":"ok")+row("프록시 URL",ZP.config.VISITSEOUL_PROXY_URL||"(미설정)",ZP.config.VISITSEOUL_PROXY_URL?"ok":"bad")+row("지도 제공자",ZP.config.GOOGLE_MAPS_KEY?"Google Maps":"OpenStreetMap (키 없음)")+row("마지막 API 호출",d.lastCall||"—")+row("프록시 캐시 시각",d.cacheAt||"—")+row("받은 콘텐츠 수",d.received)+row("정규화 성공 / 실패",`${d.normalized} / ${d.failed}`)+row("필터 통과",d.passed)+row("마지막 오류",d.lastError||"—",d.lastError?"bad":"")+row("mock 사용 여부",ZP.isDemo()?"예":"아니오",ZP.isDemo()?"bad":"ok")+row("배포 검증",ZP.config.DATA_SOURCE==="visitseoul"&&ZP.config.VISITSEOUL_PROXY_URL?"통과":"실패 — DATA_SOURCE=visitseoul 및 프록시 URL 필요",ZP.config.DATA_SOURCE==="visitseoul"&&ZP.config.VISITSEOUL_PROXY_URL?"ok":"bad");}
$("ping").onclick=async()=>{$("out").textContent="호출 중…";try{ZP.disableDemo();const r=await ZP.adapters.visitseoul.list({com_ctgry_sn:"Cg1x6l1",page_no:1});const items=ZP.findItems(r)||[];ZP.diag.received=items.length;$("out").textContent=`성공 — ${items.length}건 수신\n첫 항목 cid: ${items[0]?(items[0].cid??ZP.dig(items[0],"cid")):"—"}\n응답 요약: ${JSON.stringify(r).slice(0,600)}…`;}catch(e){ZP.diag.lastError=e.message;$("out").textContent="실패 — "+e.message;}render();};
$("demoOff").onclick=()=>{ZP.disableDemo();render();};render();})();
</script></body></html>
