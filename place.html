<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>장소 상세 — ZERO PROBLEMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="shared.css">
<style>
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;padding:20px 0 10px}
.hero .img{border-radius:20px;min-height:220px;overflow:hidden;background:linear-gradient(135deg,#D7CCEB,#B9A6DA);display:grid;place-items:center;color:#4E4762;font-weight:700}.hero .img img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.025em}.hero .cat{color:var(--muted);margin-bottom:12px}
.verdict{border-radius:16px;padding:14px 16px;background:var(--okbg);color:var(--ok);font-weight:700;margin-bottom:12px}.verdict.no{background:var(--shutbg);color:var(--shut)}.verdict.chk{background:var(--warnbg);color:var(--warn)}
.verdict ul{margin:6px 0 0;padding-left:1.1em;font-weight:500;color:var(--ink2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{min-height:44px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:10px 0 26px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}.box h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.box .v{font-size:15.5px;font-weight:600}.box .raw{overflow-wrap:anywhere;margin-top:6px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:6px 8px;line-height:1.5;white-space:pre-wrap}
.box.wide{grid-column:1/-1}.mapbox .m{height:360px}.fit li{margin:12px 0}.fit{padding-left:20px}.score{font-weight:700;color:var(--c5)}.box .v{overflow-wrap:anywhere}.na{color:var(--warn);font-weight:600}
@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="index.html" style="display:flex;align-items:center"><img src="logo-black.png" alt="ZERO PROBLEMS 로고"><span class="sub">닫힌 문제로</span></a><a class="btn btn-ghost" id="back" href="search.html">← 목록으로</a></div></header>
<main class="wrap" id="main"><div style="padding:40px;color:var(--muted)">최신 정보를 조회하는 중…</div></main>
<footer><div class="wrap"><p>정보가 없는 항목은 “정보 확인 필요”로 표시합니다. 이동시간은 추정치입니다.</p></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="data.js"></script><script src="regulations.js"></script>
<script src="catalog.js"></script><script src="explanations.js"></script><script src="ui.js"></script><script src="place.js"></script></body></html>
