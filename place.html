<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>장소 상세 — ZERO PROBLEMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="shared.css">
<style>
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 0 10px}
.hero .img{border-radius:20px;min-height:220px;overflow:hidden;background:linear-gradient(135deg,#D7CCEB,#B9A6DA);display:grid;place-items:center;color:#4E4762;font-weight:700}.hero .img img{width:100%;height:100%;object-fit:cover;display:block;min-height:220px}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.025em}.hero .cat{color:var(--muted);margin-bottom:12px}
.verdict{border-radius:16px;padding:14px 16px;background:var(--okbg);color:var(--ok);font-weight:700;margin-bottom:12px}.verdict.no{background:var(--shutbg);color:var(--shut)}.verdict.chk{background:var(--warnbg);color:var(--warn)}
.verdict ul{margin:6px 0 0;padding-left:1.1em;font-weight:500;color:var(--ink2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{min-height:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 26px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}.box h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.box .v{font-size:15.5px;font-weight:600}.box .raw{margin-top:6px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:6px 8px;line-height:1.5;white-space:pre-wrap}
.box.wide{grid-column:1/-1}.mapbox .m{height:360px}.fit li{margin:4px 0}.na{color:var(--warn);font-weight:600}
@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="index.html" style="display:flex;align-items:center"><img src="logo-black.png" alt="ZERO PROBLEMS 로고"><span class="sub">닫힌 문제로</span></a><a class="btn btn-ghost" id="back" href="search.html">← 목록으로</a></div></header>
<main class="wrap" id="main"><div style="padding:40px;color:var(--muted)">최신 정보를 조회하는 중…</div></main>
<footer><div class="wrap"><p>정보가 없는 항목은 “정보 확인 필요”로 표시합니다. 이동시간은 추정치입니다.</p></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
(async function(){
  const $=id=>document.getElementById(id);const esc=ZP.esc;const NA='<span class="na">정보 확인 필요</span>';
  const id=new URLSearchParams(location.search).get("id");if(history.length>1)$("back").onclick=e=>{e.preventDefault();history.back();};
  const S=ZP.loadState();if(!S||!S.origin){$("main").innerHTML=`<div class="notice" style="margin:30px 0">출발 조건이 없습니다. <a class="btn btn-ghost" href="index.html">조건 고르기</a></div>`;return;}
  let p;try{p=await ZP.getPlace(id);}catch(e){$("main").innerHTML=`<div class="errbox notice" style="margin:30px 0;display:block"><b>상세 정보를 불러오지 못했습니다.</b> ${esc(e.message)} <div style="margin-top:10px"><button class="btn btn-main" onclick="location.reload()">다시 시도</button> <a class="btn btn-ghost" href="search.html">목록으로</a></div></div>`;return;}
  const w=await ZP.weather(p.lat||S.origin.lat,p.lng||S.origin.lng);if(w)S.rainy=w.rainy;
  const ctx=ZP.context(S);const J=ZP.judge(p,ctx);const modeL={walk:"도보",transit:"대중교통",car:"자동차",any:"가장 빠른 수단"}[ctx.mode];
  const notes=[];if(w)notes.push(p.indoor?`강수 ${w.rainy?"있음":"없음"} — 실내 장소`:`강수 ${w.rainy?"있음":"없음"} — 야외 장소`);if(ZP.holidays2026.includes(ZP.fmtDate(ctx.date)))notes.push("공휴일 — 휴관 규칙의 공휴일 예외 확인");if(p.period.end)notes.push(`행사 종료일 ${p.period.end}`);if(p.reg)notes.push(p.reg.label+" (위반 시 과태료)");if(p.notice)notes.push(p.notice);
  document.title=`${p.name} — ZERO PROBLEMS`;
  $("main").innerHTML=`
  <div class="hero">
    <div class="img">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)} 대표 이미지" onerror="this.replaceWith(document.createTextNode('이미지 정보 없음'))">`:"대표 이미지 정보 없음"}</div>
    <div><h1>${esc(p.name)}${ZP.isDemo()?' <span class="pill shut">시연 데이터</span>':''}</h1><div class="cat">${esc([p.categoryTop,p.category].filter(Boolean).join(" · "))}${p.subway?" · "+esc(p.subway):""}</div>
      <div class="verdict ${J.ok?(J.needCheck?"chk":""):"no"}">${J.ok?(J.needCheck?"방문 전 확인 — 정보가 부족하거나 해석 신뢰도가 낮습니다":"지금 방문할 수 있습니다"):"지금은 방문할 수 없습니다"}<ul>${(J.ok?[...J.why,...J.chk]:J.no.map(n=>`${n.axis}: ${n.t}`)).map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>
      <div class="acts">${p.lat!=null?`<a class="btn btn-main" target="_blank" rel="noopener" href="${ZP.directionsUrl(p,ctx.mode==="any"?(J.usedMode||"walk"):ctx.mode)}">${modeL} 길찾기 열기 →</a>`:""}${p.url?`<a class="btn btn-ghost" target="_blank" rel="noopener" href="${esc(p.url)}">공식 사이트</a>`:""}${p.tel?`<a class="btn btn-ghost" href="tel:${esc(p.tel)}">${esc(p.tel)}</a>`:""}</div></div>
  </div>
  <div class="grid">
    <div class="box"><h3>운영시간 · 오늘 마감</h3><div class="v">${p.hours.open==null?NA:p.hours.close===24?"상시 개방":`${ZP.fmtH(p.hours.open)}–${ZP.fmtH(p.hours.close)}${p.hours.lastEntry?` · 입장 마감 ${ZP.fmtH(p.hours.lastEntry)}`:""}`}</div><div class="raw">원문: ${esc(p.raw.cmmn_use_time||"—")}</div></div>
    <div class="box"><h3>휴무일</h3><div class="v">${p.closed.confidence==="none"?NA:p.closed.weekdays.length?p.closed.weekdays.map(d=>"일월화수목금토"[d]+"요일").join(", ")+(p.closed.holidayException?" (공휴일이면 개관)":""):"정기 휴무 없음"}${p.closed.fixed.length?" · 1월 1일":""}</div><div class="raw">원문: ${esc(p.raw.closed_days||"—")}</div></div>
    <div class="box"><h3>현재 위치에서</h3><div class="v">${J.km!=null?`${J.km.toFixed(1)}km · ${modeL} 약 ${J.tmin}분 <small>(추정)</small>`:NA}</div><div class="raw">출발: ${esc(ctx.originLabel)} · ${ZP.fmtDate(ctx.date)} ${ZP.fmtH(ctx.hour)}</div></div>
    <div class="box"><h3>요금 · 예약</h3><div class="v">${p.fee.known?(p.fee.free?"무료":"유료"):NA}${p.fee.text?" · "+esc(p.fee.text):""}</div><div class="raw">${p.reservation?"예약 필요 또는 권장":"예약 관련 안내 없음"}</div></div>
    <div class="box"><h3>지원 언어</h3><div class="v">${p.langs.length?esc(p.langs.join(" · ")):NA}</div></div>
    <div class="box"><h3>접근성</h3><div class="v">${p.access.known?esc(p.access.list.join(" · ")):NA}</div></div>
    <div class="box wide"><h3>주의사항 — 날씨 · 공휴일 · 행사 · 현장 규제</h3><div class="v" style="font-weight:500">${notes.length?"<ul style='margin:0;padding-left:1.1em'>"+notes.map(n=>`<li>${esc(n)}</li>`).join("")+"</ul>":"특이사항 없음"}</div></div>
    <div class="box wide"><h3>주소 · 연락처</h3><div class="v">${p.address?esc(p.address):NA}${p.tel?" · "+esc(p.tel):""}</div>${p.url?`<div class="raw">${esc(p.url)}</div>`:""}</div>
    <div class="box wide"><h3>왜 이 장소가 내 조건에 맞는가 — 축별 판정</h3><ul class="fit" style="margin:0;padding-left:1.1em">${["시간","기간","접근","언어","비용","규제"].map(a=>{const f=J.no.filter(n=>n.axis===a);return `<li><b>${a}</b> — ${f.length?`<span style="color:var(--shut)">탈락: ${esc(f.map(n=>n.t).join(", "))}</span>`:`<span style="color:var(--ok)">통과</span>`}</li>`;}).join("")}<li><b>확인 필요</b> — ${J.chk.length?esc(J.chk.join(", ")):"없음"}</li></ul></div>
    <div class="box wide" style="padding:0;overflow:hidden"><div class="mapbox" style="border:0"><div class="m" id="map"></div><div class="legend"><span>${p.lat!=null?`좌표 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)} (${p.coordSource==="api"?"API":"지오코딩"})`:"좌표 정보 없음"}</span><span id="prov"></span></div></div><div id="maperr" class="notice" hidden></div></div>
    <div class="box wide"><h3>출처 · 시각</h3><div class="raw">콘텐츠 ID ${esc(p.id)} · 출처 ${ZP.isDemo()?"시연 데이터":"비짓서울 API (프록시 경유)"}
API 조회 시각(retrievedAt): ${new Date(p.retrievedAt).toLocaleString("ko-KR")}
원본 콘텐츠 갱신일(sourceUpdatedAt): ${esc(p.sourceUpdatedAt||"정보 없음")}
판정 신뢰도: 운영시간 ${p.hours.confidence} / 휴무일 ${p.closed.confidence}</div></div>
  </div>`;
  if(p.lat!=null){try{const map=await ZP.map($("map"),p,16,m=>{const e=$("maperr");e.hidden=false;e.textContent=m;});if(map){$("prov").textContent=map.provider==="google"?"Google Maps":"OpenStreetMap";map.add(p,{color:J.ok?"#0F9D58":"#B0B8C1",label:p.name});map.add(S.origin,{color:"#7437B0",me:true,label:ctx.originLabel});map.fit();}}catch(e){}}
  else $("map").innerHTML='<div style="padding:30px;text-align:center;color:var(--muted)">좌표가 없어 지도를 표시할 수 없습니다</div>';
})();
</script>
</body>
</html>
