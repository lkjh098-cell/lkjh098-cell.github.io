<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>장소 상세 — ZERO PROBLEMS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="shared.css">
<style>
.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:22px 0 10px;align-items:stretch}
.hero .img{border-radius:20px;min-height:220px;display:grid;place-items:end start;padding:18px;color:#fff;font-weight:800;font-size:22px;position:relative;overflow:hidden}
.hero .img small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:4px}
.hero .info h1{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.025em;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hero .info .cat{color:var(--muted);margin-bottom:12px}
.verdict{border-radius:16px;padding:14px 16px;background:var(--okbg);color:var(--ok);font-weight:700;margin-bottom:12px}.verdict.no{background:var(--shutbg);color:var(--shut)}.verdict.chk{background:var(--warnbg);color:var(--warn)}
.verdict ul{margin:6px 0 0;padding-left:1.1em;font-weight:500;color:var(--ink2);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0 26px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}.box h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.box .v{font-size:15.5px;font-weight:600}.box .raw{margin-top:6px;font-size:12.5px;color:var(--muted);font-family:ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:6px 8px;line-height:1.5}
.box.wide{grid-column:1/-1}
.mapbox .m{height:380px}
.fit li{margin:4px 0}
@media(max-width:800px){.hero,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="index.html" style="display:flex;align-items:center"><img src="logo-black.png" alt="ZERO PROBLEMS 닫힌 문제로 로고"><span class="sub">닫힌 문제로</span></a>
  <a class="btn btn-ghost" id="back" href="search.html">← 목록으로</a>
</div></header>
<main class="wrap" id="main"><div style="padding:40px;color:var(--muted)">불러오는 중…</div></main>
<footer><div class="wrap"><p>좌표·주소는 실제이며 운영정보는 공개 안내 기준 시연 표본입니다. 실제 서비스는 비짓서울 API 실시간 값과 공휴일·기상청·대중교통·서울시 도시데이터를 결합해 판정합니다.</p></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js" onerror="void 0"></script>
<script src="data.js"></script>
<script>
(async function(){
  const id=new URLSearchParams(location.search).get("id"); const $=id=>document.getElementById(id);
  if(history.length>1)$("back").onclick=e=>{e.preventDefault();history.back();};
  const S=ZP.loadState()||{origin:ZP.areas["광화문·종로"],originLabel:"광화문·종로",remain:"3",mode:"walk",langs:["ko"]}; if(!S.origin){S.origin=ZP.areas["광화문·종로"];S.originLabel="광화문·종로";}
  const ad=ZP.adapters[ZP.config.DATA_SOURCE]||ZP.adapters.mock; let p;
  try{ p=ZP.normalize(await ad.info(id)); }catch(e){ $("main").innerHTML=`<div class="notice" style="margin:30px 0">장소를 찾을 수 없습니다 (${id||"id 없음"}). <a href="search.html" class="btn btn-ghost">목록으로</a></div>`; return; }
  const w=await ZP.weather(p.lat,p.lng); if(w)S.rainy=w.rainy;
  const ctx=ZP.context(S); const J=ZP.judge(p,ctx);
  const gate=p.hours.lastEntry??p.hours.close; const modeL={walk:"도보",transit:"대중교통",car:"자동차"}[ctx.mode];
  const g=["g","g2","g3","g4"][p.id.charCodeAt(p.id.length-1)%4];
  const notes=[]; if(w&&w.rainy)notes.push(p.indoor?"강수 예보 — 실내 장소라 영향 적음":"강수 예보 — 야외 장소, 우천 시 이용 제한 가능"); if(ZP.holidays2026.includes(ZP.fmtDate(ctx.date)))notes.push("공휴일 — 휴관 규칙의 공휴일 예외 확인"); if(p.period.end)notes.push(`행사 종료일 ${p.period.end}`); if(p.reg)notes.push(p.reg.label+" (위반 시 과태료)"); if(p.notice)notes.push(p.notice);
  document.title=`${p.name} — ZERO PROBLEMS`;
  $("main").innerHTML=`
  <div class="hero">
    <div class="img ${g}">${p.name}<small>${p.categoryTop} · ${p.category} · 대표 이미지는 비짓서울 main_img 연결 예정</small></div>
    <div class="info">
      <h1>${p.name} ${p.demo?'<span class="pill shut">예시</span>':''}</h1>
      <div class="cat">${p.address} · ${p.subway||""}</div>
      <div class="verdict ${J.ok?(J.needCheck?"chk":""):"no"}">${J.ok?(J.needCheck?"확인 필요 — 운영정보 해석에 예외가 있어 방문 전 확인을 권합니다":"지금 방문할 수 있습니다"):"지금은 방문할 수 없습니다"}
        <ul>${(J.ok?J.why:J.no.map(n=>`${n.axis}: ${n.t}`)).map(t=>`<li>${t}</li>`).join("")}</ul></div>
      <div class="acts"><a class="btn btn-main" target="_blank" rel="noopener" href="${ZP.directionsUrl(p,ctx.mode)}">${modeL} 길찾기 열기 →</a>${p.url?`<a class="btn btn-ghost" target="_blank" rel="noopener" href="${p.url}">공식 사이트</a>`:""}${p.tel?`<a class="btn btn-ghost" href="tel:${p.tel}">${p.tel}</a>`:""}</div>
    </div>
  </div>
  <div class="grid">
    <div class="box"><h3>운영시간 · 오늘 마감</h3><div class="v">${p.hours.open==null?"확인 필요":p.hours.close===24?"상시 개방":`${ZP.fmtH(p.hours.open)}–${ZP.fmtH(p.hours.close)}${p.hours.lastEntry?` · 입장 마감 ${ZP.fmtH(p.hours.lastEntry)}`:""}`}</div><div class="raw">원문: ${p.raw.cmmn_use_time||"—"}</div></div>
    <div class="box"><h3>휴무일</h3><div class="v">${p.closed.weekdays.length?p.closed.weekdays.map(d=>"일월화수목금토"[d]+"요일").join(", ")+(p.closed.holidayException?" (공휴일이면 개관)":""):"정기 휴무 없음"}${p.closed.fixed.length?" · 1월 1일":""}</div><div class="raw">원문: ${p.raw.closed_days||"—"}</div></div>
    <div class="box"><h3>현재 위치에서</h3><div class="v">${J.km.toFixed(1)}km · ${modeL} 약 ${J.tmin}분 (추정)</div><div class="raw">출발: ${ctx.originLabel} · ${ZP.fmtDate(ctx.date)} ${ZP.fmtH(ctx.hour)}</div></div>
    <div class="box"><h3>요금 · 예약</h3><div class="v">${p.fee.free?"무료":"유료"} · ${p.fee.text||"—"}</div><div class="raw">${p.reservation?"예약 필요 또는 권장":"별도 예약 불필요"}</div></div>
    <div class="box"><h3>지원 언어</h3><div class="v">${p.langs.join(" · ")}</div></div>
    <div class="box"><h3>접근성</h3><div class="v">${p.access.list.length?p.access.list.join(" · "):"정보 없음 — 확인 필요"}</div></div>
    <div class="box wide"><h3>주의사항 — 날씨 · 공휴일 · 행사 · 현장 규제</h3><div class="v" style="font-weight:500">${notes.length?"<ul style='margin:0;padding-left:1.1em'>"+notes.map(n=>`<li>${n}</li>`).join("")+"</ul>":"특이사항 없음"}</div></div>
    <div class="box wide"><h3>왜 이 장소가 내 조건에 맞는가 — 축별 판정</h3><ul class="fit" style="margin:0;padding-left:1.1em">
      ${["시간","기간","접근","언어","비용","규제"].map(a=>{const fail=J.no.filter(n=>n.axis===a);return `<li><b>${a}</b> — ${fail.length?`<span style="color:var(--shut)">탈락: ${fail.map(n=>n.t).join(", ")}</span>`:`<span style="color:var(--ok)">통과</span>`}</li>`;}).join("")}
      <li><b>보강 데이터</b> — ${w?`기상(Open-Meteo) ${w.temp}℃ · 강수 ${w.rainy?"있음":"없음"}`:"기상 조회 실패"} · 공휴일 표 · 규제 정보</li></ul></div>
    <div class="box wide" style="padding:0;overflow:hidden"><div class="mapbox" style="border:0"><div class="m" id="map"></div><div class="legend"><span>주소: ${p.address}</span><span>좌표: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span><span id="prov"></span></div></div><div id="maperr" class="notice" hidden></div></div>
    <div class="box wide"><h3>출처</h3><div class="raw">콘텐츠 ID ${p.id} · ${p.source} · 마지막 갱신 ${p.updated} · 판정 신뢰도: 운영시간 ${p.hours.confidence} / 휴무일 ${p.closed.confidence}</div></div>
  </div>`;
  try{ const map=await ZP.map($("map"),p,16,msg=>{const e=$("maperr");e.hidden=false;e.innerHTML=`${msg} <button onclick="location.reload()">다시 시도</button>`;});
    if(map){ $("prov").textContent=map.provider==="google"?"Google Maps":"OpenStreetMap"; map.add(p,{color:J.ok?"#0F9D58":"#B0B8C1",label:p.name}); map.add(S.origin,{color:"#7437B0",me:true,label:ctx.originLabel}); map.fit(); } }catch(e){}
})();
</script>
</body>
</html>
